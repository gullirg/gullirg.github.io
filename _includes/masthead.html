{% include base_path %}

<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="masthead__name" href="{{ base_path }}/">{{ site.title }}</a>
    <nav class="masthead__nav" aria-label="Main">
      <ul>
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}{% assign domain = '' %}{% else %}{% assign domain = base_path %}{% endif %}
          <li><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
