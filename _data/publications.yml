- id: reggio2026hexmod
  type: preprint
  selected: true
  title: "Firing rate adaptation in grid cells produces macroscopic hexadirectional modulation"
  authors: "G. Reggio*, M. Kim*, Z. Ji, D. Bush, C. Barry, N. Burgess"
  venue: "Submitted"
  year: 2026
  note: "Preprint on bioRxiv coming soon."
  # When bioRxiv posts the preprint: set doi (10.1101/...), change venue to "bioRxiv",
  # and remove the note. Add code once the GitHub repository is public:
  # code: "https://github.com/gullirg/hexmod-grid-cell-adaptation"
  data: "https://doi.org/10.5281/zenodo.23477461"
  abstract: >-
    Hexadirectional modulation (HexMod) of macroscopic neural activity by movement direction
    is widely used to measure grid cell activity in human neuroimaging, but its neuronal origin
    is unclear. Two mechanisms have been proposed: conjunctive grid×direction cells whose
    preferred directions align with the grid axes, and firing rate adaptation, which reduces
    firing when grid fields are visited in quick succession during movement along grid axes.
    Analysing almost 4,000 grid cells from foraging rats, we found that conjunctive cells'
    directional tuning was broad and unaligned with grid axes, whereas firing was reduced
    shortly after grid field visits, consistent with firing rate adaptation. Simulations of
    realistic grid cell populations demonstrate HexMod with the typical trajectories of human
    experiments, and show how it depends on grid scale, adaptation time constant, movement
    speed, and controlling for variation with location. We show firing rate adaptation provides
    a plausible mechanism for HexMod and a framework for relating human neuroimaging to
    neuronal activity.

