# Site configuration. Restart `jekyll serve` after editing this file.

# Site
locale                   : "en-US"
title                    : "Guglielmo Reggio"
title_separator          : "–"
name                     : &name "Guglielmo Reggio"
description              : &description "PhD candidate in computational neuroscience at UCL, working on grid cells, hexadirectional modulation and firing-rate adaptation."
url                      : https://gullirg.github.io
baseurl                  : ""
repository               : "gullirg/gullirg.github.io"
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
comments:
  provider               : false
atom_feed:
  path                   :

# SEO
google_site_verification :
bing_site_verification   :
twitter:
  username               : "guglielmoreggio"
og_image                 : "new_photo.jpg" # in /images/
social:
  type                   : Person
  name                   : *name
  links:
    - "https://orcid.org/0009-0005-9302-0610"
    - "https://scholar.google.com/citations?user=IoyjYjMAAAAJ"
    - "https://github.com/gullirg"
    - "https://www.linkedin.com/in/guglielmo-reggio"
    - "https://twitter.com/guglielmoreggio"

analytics:
  provider               : false

# Author (sidebar). Empty fields are hidden.
author:
  name             : "Guglielmo Reggio"
  avatar           : "new_photo.jpg"
  bio              : "PhD candidate in computational neuroscience"
  affiliation      : "UCL Institute of Cognitive Neuroscience"
  affiliation_url  : "https://www.ucl.ac.uk/icn/"
  location         : "London, UK"
  email            : "guglielmo.reggio@gmail.com"
  googlescholar    : "https://scholar.google.com/citations?user=IoyjYjMAAAAJ"
  orcid            : "https://orcid.org/0009-0005-9302-0610"
  github           : "gullirg"
  linkedin         : "guglielmo-reggio"
  twitter          : "guglielmoreggio"
  cv               : "/files/Guglielmo_Reggio_CV.pdf"


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .claude
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - package.json
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  portfolio:
    output: true
    permalink: /:collection/:path/


# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: Europe/London


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from


# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
